const CATEGORIES = [
  'Electronics & Components',
  'Industrial Machinery',
  'Office Supplies',
  'Automotive Parts',
  'Raw Materials',
  'Safety & PPE',
  'Packaging & Shipping',

];

const SUPPLIERS = [
  { name: 'Apex Industrial Supply', email: 'orders@apexind.com' },
  { name: 'Global Tech Components', email: 'supply@globaltech.io' },
  { name: 'Vanguard Materials Ltd.', email: 'contact@vanguardmat.com' },

  { name: 'BioTech Scientific Supplies', email: 'sales@biotechsci.com' }
];

const ADJECTIVES = ['Ultra', 'Pro', 'Heavy-Duty', 'Compact', 'Precision', 'Eco-Smart', 'Industrial', 'Modular', 'Advanced', 'Standard'];
const NOUNS = ['Sensor Module', 'Hydraulic Valve', 'Microcontroller', 'Steel Fastener', 'Filter Assembly', 'Thermal Relay', 'Pneumatic Actuator', 'Fiber Optic Cable', 'Power Inverter', 'Safety Goggles'];

function generateMockProductsBatch(startIndex, count) {
  const products = [];
  const now = new Date();

  for (let i = startIndex; i < startIndex + count; i++) {
    const adj = ADJECTIVES[i % ADJECTIVES.length];
    const noun = NOUNS[(i * 7) % NOUNS.length];
    const category = CATEGORIES[(i * 3) % CATEGORIES.length];
    const supplierObj = SUPPLIERS[(i * 5) % SUPPLIERS.length];

    const sku = `SKU-${category.substring(0, 3).toUpperCase()}-${String(i).padStart(7, '0')}`;
    const price = parseFloat((((i * 13) % 490) + 9.99).toFixed(2));
    const cost = parseFloat((price * 0.65).toFixed(2));
    const stock = (i % 17 === 0) ? 0 : (i % 9 === 0) ? Math.floor(Math.random() * 12) + 1 : Math.floor(((i * 23) % 450) + 15);
    const reorderPoint = 20;

    let status = 'In Stock';
    if (stock === 0) status = 'Out of Stock';
    else if (stock <= reorderPoint) status = 'Low Stock';

    products.push({
      id: i,
      sku,
      name: `${adj} ${noun} #${1000 + i}`,
      category,
      price,
      cost,
      stock,
      reorderPoint,
      supplier: supplierObj.name,
      supplierEmail: supplierObj.email,
      status,
      lastUpdated: new Date(now.getTime() - (i % 30) * 86400000).toISOString().split('T')[0]
    });
  }
  return products;
}

export default function App() {

  // Live Overload State

    setToastMessage(msg);
    setTimeout(() => setToastMessage(null), 3500);
  };

  // ==========================================
  // LIVE STREAMING OVERLOAD & CRASH HANDLER
  // ==========================================
  const handleTriggerCrash = () => {
    setIsOverloading(true);
    setActiveTab('inventory');

    let currentTotal = products.length;
    let memoryGarbage = [];

    const loadNextBatch = () => {
      // 1. Add 25,000 new records every frame
      const batchSize = 25000;
      const newItems = generateMockProductsBatch(currentTotal + 1, batchSize);

      setProducts(prev => [...prev, ...newItems]);
      currentTotal += batchSize;
      setLiveCount(currentTotal);

      // 2. Allocate heavy heap array to simulate severe memory leak
      for (let i = 0; i < 50; i++) {
        memoryGarbage.push(new Array(200000).fill(`HEAVY_MEMORY_NODE_${currentTotal}_${i}`));
      }

      // Estimate allocated memory dynamically
      const approxHeap = Math.round((currentTotal * 0.0025) + (memoryGarbage.length * 0.8));
      setHeapMB(approxHeap);

      // 3. When reaching ~500,000 items, lock main thread completely to trigger unresponsive tab prompt
      if (currentTotal >= 500000) {
        while (true) {
          memoryGarbage.push(new Array(1000000).fill('FINAL_OOM_LOCKUP'));
        }
      } else {
        requestAnimationFrame(loadNextBatch);
      }
    };

    requestAnimationFrame(loadNextBatch);
  };

  const filteredProducts = useMemo(() => {
    return products.filter(p => {
      const matchesSearch = globalSearch === '' ||
        p.name.toLowerCase().includes(globalSearch.toLowerCase()) ||
        p.sku.toLowerCase().includes(globalSearch.toLowerCase()) ||
        p.supplier.toLowerCase().includes(globalSearch.toLowerCase());

      const matchesCategory = selectedCategory === 'All' || p.category === selectedCategory;
      const matchesStock = selectedStockFilter === 'All' || p.status === selectedStockFilter;

      return matchesSearch && matchesCategory && matchesStock;
    });
  }, [products, globalSearch, selectedCategory, selectedStockFilter]);

  const totalPages = Math.ceil(filteredProducts.length / itemsPerPage);

  const paginatedProducts = useMemo(() => {
    // When overloading, render everything unpaginated so DOM tree swells live
    if (isOverloading) {
      return filteredProducts;
    }
    const start = (currentPage - 1) * itemsPerPage;
    return filteredProducts.slice(start, start + itemsPerPage);
  }, [filteredProducts, currentPage, itemsPerPage, isOverloading]);

  useEffect(() => {
    setCurrentPage(1);
  }, [globalSearch, selectedCategory, selectedStockFilter, itemsPerPage]);

  const stats = useMemo(() => {
    const totalInventoryCount = products.reduce((acc, p) => acc + p.stock, 0);
    const lowStockCount = products.filter(p => p.status === 'Low Stock').length;
    const outOfStockCount = products.filter(p => p.status === 'Out of Stock').length;
    const inventoryValuation = products.reduce((acc, p) => acc + (p.cost * p.stock), 0);
    const pipelineValue = leads.reduce((acc, l) => acc + l.dealValue, 0);

    return {
      totalProducts: products.length,
      totalInventoryCount,
      lowStockCount,
      outOfStockCount,
      inventoryValuation,
      pipelineValue,
      totalLeadsCount: leads.length,
      totalOrdersCount: orders.length
    };
  }, [products, leads, orders]);

  const handleSaveProduct = (updatedProduct) => {
    const stockVal = Math.max(0, parseInt(updatedProduct.stock, 10) || 0);
    const reorderPt = Number(updatedProduct.reorderPoint) || 20;
    const computedStatus = stockVal === 0 ? 'Out of Stock' : stockVal <= reorderPt ? 'Low Stock' : 'In Stock';
    const finalProduct = {
      ...updatedProduct,
      price: Math.max(0, parseFloat(updatedProduct.price) || 0),
      stock: stockVal,
      status: computedStatus,
      lastUpdated: new Date().toISOString().split('T')[0]
    };
    setProducts(prev => prev.map(p => p.id === finalProduct.id ? finalProduct : p));
    setIsEditModalOpen(false);
    setSelectedProduct(null);
    showToast(`Product ${finalProduct.sku} updated successfully!`);
  };

  const handleAddProduct = (newProductData) => {
    const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
    const stockVal = Math.max(0, parseInt(newProductData.stock, 10) || 0);
    const reorderPt = Number(newProductData.reorderPoint) || 20;
    const newProduct = {
      id: newId,
      ...newProductData,
      price: Math.max(0, parseFloat(newProductData.price) || 0),
      cost: Math.max(0, parseFloat(newProductData.cost) || 0),
      stock: stockVal,
      reorderPoint: reorderPt,
      status: stockVal === 0 ? 'Out of Stock' : stockVal <= reorderPt ? 'Low Stock' : 'In Stock',
      lastUpdated: new Date().toISOString().split('T')[0]

    setProducts([newProduct, ...products]);
    setIsAddModalOpen(false);
    showToast(`New Product ${newProduct.sku} created successfully!`);
  };

  const handleDeleteProduct = (id) => {

    const headers = ['ID', 'SKU', 'Name', 'Category', 'Price ($)', 'Cost ($)', 'Stock', 'Status', 'Supplier'];

      `"${p.category}"`,
      p.price,
      p.cost,
      p.stock,
      `"${p.status}"`,
      `"${p.supplier}"`

    link.click();
    document.body.removeChild(link);
    showToast(`Exported ${Math.min(filteredProducts.length, 2000)} items to CSV!`);

      <aside className="w-64 bg-slate-950 border-r border-slate-800 flex flex-col justify-between shrink-0">
        <div>
          <div className="p-5 border-b border-slate-800 flex items-center gap-3">
            <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-600 via-blue-600 to-cyan-400 flex items-center justify-center shadow-lg shadow-indigo-500/20">
              <Building2 className="w-6 h-6 text-white" />
            </div>
            <div>
              <h1 className="font-bold text-lg leading-tight tracking-tight text-white">NEXUS ERP/CRM</h1>
              <span className="text-xs font-medium text-indigo-400 bg-indigo-950/80 px-2 py-0.5 rounded border border-indigo-800/50">v4.8 Enterprise</span>
            </div>
          </div>

          <nav className="p-3 space-y-1">
            <div className="px-3 py-2 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Main</div>

            <button
              onClick={() => setActiveTab('dashboard')}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm font-medium transition-colors ${activeTab === 'dashboard' ? 'bg-indigo-600 text-white shadow-md shadow-indigo-600/30' : 'text-slate-400 hover:bg-slate-900 hover:text-slate-200'
                }`}
            >
              <LayoutDashboard className="w-4 h-4" />
              Executive Dashboard
            </button>

            <div className="px-3 py-2 text-[11px] font-semibold text-slate-500 uppercase tracking-wider mt-4">ERP Modules</div>

            <button
              onClick={() => setActiveTab('inventory')}

                        <td className="p-4 font-mono text-emerald-400 font-semibold">${order.total.toFixed(2)}</td>
                        <td className="p-4 font-mono text-slate-300">{order.itemsCount} SKUs</td>
                        <td className="p-4">
                          <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${order.status === 'Completed' ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800/60' :
                            order.status === 'Shipped' ? 'bg-blue-950/60 text-blue-400 border-blue-800/60' :
                              'bg-amber-950/60 text-amber-400 border-amber-800/60'
                            }`}>
                            {order.status}
                          </span>
                        </td>
                        <td className="p-4">
                          <span className={`text-xs font-semibold px-2 py-0.5 rounded ${order.payment === 'Paid' ? 'text-emerald-400 bg-emerald-950/40' : 'text-amber-400 bg-amber-950/40'}`}>
                            {order.payment}
                          </span>
                        </td>
                        <td className="p-4 text-slate-300 text-xs">{order.date}</td>
                        <td className="p-4 text-right">
                          <button onClick={() => showToast(`Viewing order ${order.id}`)} className="p-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-indigo-400">
                            <Eye className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 4: PURCHASE ORDERS */}
          {activeTab === 'purchasing' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <div>
                  <h2 className="text-2xl font-black tracking-tight text-white">Supplier Purchase Orders (PO)</h2>
                  <p className="text-sm text-slate-400">Manage inbound procurement and vendor restocking shipments</p>
                </div>
                <button
                  onClick={() => showToast('New Purchase Order generated.')}
                  className="flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all"
                >
                  <Plus className="w-4 h-4" /> Create PO
                </button>
              </div>

              <div className="bg-slate-950/80 border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-slate-800 bg-slate-900/60 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                      <th className="p-4">PO Number</th>
                      <th className="p-4">Supplier Name</th>
                      <th className="p-4">Ordered Items</th>
                      <th className="p-4">Total Value</th>
                      <th className="p-4">Status</th>
                      <th className="p-4">Expected Delivery</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 text-sm">
                    {purchaseOrders.map(po => (
                      <tr key={po.id} className="hover:bg-slate-900/50 transition-colors">
                        <td className="p-4 font-mono text-indigo-400 font-semibold">{po.id}</td>
                        <td className="p-4 font-medium text-white">{po.supplier}</td>
                        <td className="p-4 text-slate-300 text-xs">{po.items}</td>
                        <td className="p-4 font-mono text-emerald-400 font-semibold">${po.total.toLocaleString()}</td>
                        <td className="p-4">
                          <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium border ${po.status === 'Delivered' ? 'bg-emerald-950/60 text-emerald-400 border-emerald-800/60' :
                            po.status === 'In Transit' ? 'bg-blue-950/60 text-blue-400 border-blue-800/60' :
                              'bg-slate-800 text-slate-300 border-slate-700'
                            }`}>
                            {po.status}
                          </span>
                        </td>
                        <td className="p-4 text-slate-300 text-xs">{po.expectedDate}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 5: LEADS & CONTACTS */}
          {activeTab === 'contacts' && (
            <div className="space-y-6">
              <div className="flex justify-between items-center">
                <div>
                  <h2 className="text-2xl font-black tracking-tight text-white">CRM Leads & Contacts Directory</h2>
                  <p className="text-sm text-slate-400">Manage B2B client accounts, lead scores, and communication history</p>
                </div>
                <button
                  onClick={() => showToast('New Lead added to CRM.')}
                  className="flex items-center gap-2 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-sm shadow-lg shadow-indigo-600/30 transition-all"
                >
                  <Plus className="w-4 h-4" /> Add Lead
                </button>
              </div>

              <div className="bg-slate-950/80 border border-slate-800/80 rounded-2xl shadow-xl overflow-hidden">
                <table className="w-full text-left border-collapse">
                  <thead>
                    <tr className="border-b border-slate-800 bg-slate-900/60 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                      <th className="p-4">Contact Name</th>
                      <th className="p-4">Company</th>
                      <th className="p-4">Email / Phone</th>
                      <th className="p-4">Pipeline Stage</th>
                      <th className="p-4">Deal Value</th>
                      <th className="p-4">Lead Score</th>
                      <th className="p-4 text-right">Actions</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/60 text-sm">
                    {leads.map(lead => (
                      <tr key={lead.id} className="hover:bg-slate-900/50 transition-colors">
                        <td className="p-4 font-semibold text-white">{lead.name}</td>
                        <td className="p-4 text-indigo-300 font-medium">{lead.company}</td>
                        <td className="p-4 text-xs text-slate-400 space-y-0.5">
                          <div className="flex items-center gap-1.5"><Mail className="w-3 h-3 text-slate-500" /> {lead.email}</div>
                          <div className="flex items-center gap-1.5"><Phone className="w-3 h-3 text-slate-500" /> {lead.phone}</div>
                        </td>
                        <td className="p-4">
                          <span className="px-2.5 py-1 rounded-lg text-xs font-medium bg-indigo-950/80 text-indigo-300 border border-indigo-800/50">
                            {lead.stage}
                          </span>
                        </td>
                        <td className="p-4 font-mono text-emerald-400 font-semibold">${lead.dealValue.toLocaleString()}</td>
                        <td className="p-4">
                          <span className="font-mono font-bold text-xs text-cyan-400 bg-cyan-950/40 px-2 py-1 rounded border border-cyan-900/50">
                            {lead.score} / 100
                          </span>
                        </td>
                        <td className="p-4 text-right">
                          <button onClick={() => showToast(`Contacting ${lead.name}`)} className="p-1.5 rounded-lg bg-slate-900 border border-slate-800 text-slate-400 hover:text-indigo-400">
                            <Mail className="w-4 h-4" />
                          </button>
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* TAB 6: DEALS KANBAN BOARD */}
          {activeTab === 'kanban' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-2xl font-black tracking-tight text-white">Sales Deals Kanban Pipeline</h2>
                <p className="text-sm text-slate-400">Visual sales stages and pipeline management workflow</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-4 gap-4">
                {['New Lead', 'Proposal', 'Negotiation', 'Closed-Won'].map(stage => (
                  <div key={stage} className="bg-slate-950/80 border border-slate-800 rounded-2xl p-4 shadow-xl flex flex-col gap-3">
                    <div className="flex items-center justify-between pb-2 border-b border-slate-800">
                      <span className="text-xs font-bold uppercase tracking-wider text-slate-300">{stage}</span>
                      <span className="text-xs bg-slate-900 text-indigo-400 font-mono px-2 py-0.5 rounded border border-slate-800">
                        {leads.filter(l => l.stage === stage).length}
                      </span>
                    </div>

                    <div className="space-y-3 flex-1">
                      {leads.filter(l => l.stage === stage).map(lead => (
                        <div key={lead.id} className="bg-slate-900 border border-slate-800/80 rounded-xl p-3.5 shadow hover:border-indigo-500/50 transition-all space-y-2">
                          <div className="flex justify-between items-start">
                            <span className="text-xs font-bold text-white">{lead.company}</span>
                            <span className="text-[10px] font-mono text-emerald-400 font-semibold">${lead.dealValue.toLocaleString()}</span>
                          </div>
                          <p className="text-xs text-slate-400">{lead.name}</p>
                          <div className="flex justify-between items-center pt-2 border-t border-slate-800/80 text-[10px] text-slate-500">
                            <span>Score: {lead.score}</span>
                            <span className="text-indigo-400 font-medium">{lead.source}</span>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 7: REPORTS & BI ANALYTICS */}
          {activeTab === 'analytics' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-2xl font-black tracking-tight text-white">Business Intelligence Reports</h2>
                <p className="text-sm text-slate-400">Deep-dive inventory turnover, supply chain velocity, and sales forecasting</p>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-3">
                  <div className="p-3 rounded-xl bg-indigo-500/10 text-indigo-400 w-fit border border-indigo-500/20"><BarChart3 className="w-5 h-5" /></div>
                  <h3 className="text-base font-bold text-white">Inventory Turnover Ratio</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Average inventory turned over 6.4 times annually across product categories.</p>
                  <div className="pt-2 text-sm font-bold text-emerald-400 font-mono">Efficiency: +8.4% YoY</div>
                </div>

                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-3">
                  <div className="p-3 rounded-xl bg-emerald-500/10 text-emerald-400 w-fit border border-emerald-500/20"><TrendingUp className="w-5 h-5" /></div>
                  <h3 className="text-base font-bold text-white">Sales Conversion Velocity</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Average lead-to-close duration decreased to 18.5 days across active pipelines.</p>
                  <div className="pt-2 text-sm font-bold text-emerald-400 font-mono">Velocity: +12.1%</div>
                </div>

                <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-3">
                  <div className="p-3 rounded-xl bg-amber-500/10 text-amber-400 w-fit border border-amber-500/20"><AlertTriangle className="w-5 h-5" /></div>
                  <h3 className="text-base font-bold text-white">Procurement Risk Analysis</h3>
                  <p className="text-xs text-slate-400 leading-relaxed">Critical out-of-stock items require immediate purchase order re-routing.</p>
                  <div className="pt-2 text-sm font-bold text-amber-400 font-mono">Risk Level: Moderate</div>
                </div>
              </div>
            </div>
          )}

          {/* TAB 8: SYSTEM DATA SETTINGS */}
          {activeTab === 'settings' && (
            <div className="space-y-6">
              <div>
                <h2 className="text-2xl font-black tracking-tight text-white">System Data Settings & Maintenance</h2>
                <p className="text-sm text-slate-400">Database configurations, procedural cache generators, and storage options</p>
              </div>

              <div className="bg-slate-950/80 border border-slate-800 rounded-2xl p-6 shadow-xl max-w-2xl space-y-6">
                <div>
                  <h3 className="text-sm font-bold text-white mb-1">Database Cache</h3>
                  <p className="text-xs text-slate-400 mb-4">Reset or regenerate procedural inventory records.</p>
                  <button
                    onClick={handleResetData}
                    className="flex items-center gap-2 px-4 py-2.5 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs shadow-lg shadow-indigo-600/30 transition-all"
                  >
                    <RefreshCw className="w-4 h-4" /> Regenerate Database
                  </button>
                </div>
              </div>
            </div>
          )}

        </main>
      </div>

      {/* EDIT PRODUCT MODAL */}
      {isEditModalOpen && selectedProduct && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
            <div className="flex justify-between items-center pb-3 border-b border-slate-800">
              <h3 className="text-lg font-bold text-white">Edit Product SKU: {selectedProduct.sku}</h3>
              <button onClick={() => setIsEditModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
            </div>

            <div className="space-y-3 text-sm">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Product Name</label>
                <input
                  type="text"
                  value={selectedProduct.name}
                  onChange={(e) => setSelectedProduct({ ...selectedProduct, name: e.target.value })}
                  className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500"
                />
              </div>

              <div className="grid grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Price ($)</label>
                  <input
                    type="number"
                    value={selectedProduct.price}
                    onChange={(e) => setSelectedProduct({ ...selectedProduct, price: parseFloat(e.target.value) || 0 })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono"
                  />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Stock Units</label>
                  <input
                    type="number"
                    value={selectedProduct.stock}
                    onChange={(e) => setSelectedProduct({ ...selectedProduct, stock: parseInt(e.target.value) || 0 })}
                    className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono"
                  />
                </div>
              </div>
            </div>

            <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
              <button onClick={() => setIsEditModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700">Cancel</button>
              <button onClick={() => handleSaveProduct(selectedProduct)} className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500">Save Changes</button>
            </div>
          </div>
        </div>
      )}

      {/* ADD PRODUCT MODAL */}
      {isAddModalOpen && (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-lg w-full shadow-2xl space-y-4">
            <div className="flex justify-between items-center pb-3 border-b border-slate-800">
              <h3 className="text-lg font-bold text-white">Add New Inventory SKU</h3>
              <button onClick={() => setIsAddModalOpen(false)} className="text-slate-400 hover:text-white"><X className="w-5 h-5" /></button>
            </div>

            <form onSubmit={(e) => {
              e.preventDefault();
              const formData = new FormData(e.target);
              handleAddProduct({
                sku: `SKU-NEW-${Math.floor(1000 + Math.random() * 9000)}`,
                name: formData.get('name'),
                category: formData.get('category'),
                price: parseFloat(formData.get('price')) || 49.99,
                cost: parseFloat(formData.get('cost')) || 25.00,
                stock: parseInt(formData.get('stock')) || 100,
                reorderPoint: 20,
                supplier: 'Apex Industrial Supply',
                supplierEmail: 'orders@apexind.com'
              });
            }} className="space-y-3 text-sm">
              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Product Name</label>
                <input name="name" required placeholder="e.g. Ultra Sensor Unit" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500" />
              </div>

              <div>
                <label className="block text-xs font-medium text-slate-400 mb-1">Category</label>
                <select name="category" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500">
                  {CATEGORIES.map(cat => <option key={cat} value={cat}>{cat}</option>)}
                </select>
              </div>

              <div className="grid grid-cols-3 gap-3">
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Price ($)</label>
                  <input name="price" type="number" step="0.01" defaultValue="99.99" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Cost ($)</label>
                  <input name="cost" type="number" step="0.01" defaultValue="50.00" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono" />
                </div>
                <div>
                  <label className="block text-xs font-medium text-slate-400 mb-1">Initial Stock</label>
                  <input name="stock" type="number" defaultValue="150" className="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-white focus:outline-none focus:border-indigo-500 font-mono" />
                </div>
              </div>

              <div className="flex justify-end gap-3 pt-3 border-t border-slate-800">
                <button type="button" onClick={() => setIsAddModalOpen(false)} className="px-4 py-2 rounded-xl bg-slate-800 text-slate-300 text-xs font-semibold hover:bg-slate-700">Cancel</button>
                <button type="submit" className="px-4 py-2 rounded-xl bg-indigo-600 text-white text-xs font-semibold hover:bg-indigo-500">Create Product</button>
              </div>
            </form>
          </div>
        </div>
      )}

    </div>
  );
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
