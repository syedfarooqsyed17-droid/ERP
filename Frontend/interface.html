<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS ERP & CRM Platform</title>
</head>

<body>
  <!-- Your ERP UI Elements -->
  <div class="dashboard-container">
    <h1>NEXUS ERP/CRM Platform v4.8</h1>
    <button id="crash-web-btn" class="Crash Web">Crash Web</button>
  </div>

  <!-- Warden Live Telemetry Dispatch Script -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Find the Crash Web button dynamically by ID, class, or text content
      let crashWebBtn = document.getElementById('crash-web-btn') || document.querySelector('.Crash Web');

      if (!crashWebBtn) {
        const buttons = document.querySelectorAll('button');
        buttons.forEach(btn => {
          if (btn.textContent.includes('Crash Web')) {
            crashWebBtn = btn;
          }
        });
      }

      if (crashWebBtn) {
        crashWebBtn.addEventListener('click', async () => {
          console.log("[WARDEN] Crash Web triggered. Dispatches live telemetry POST...");

          try {
            // Dispatch automated POST request to the local/live backend queue
            const response = await fetch('/api/v1/crash-trigger', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                typeClass: "DOM_MEMORY_LEAK_OVERLOAD",
                cwe: "CWE-400",
                path: "Frontend/interface.jsx",
                payload: "UNPAGINATED_DOM_STREAM_ACTIVE",
                vulnCode: "function renderTable() {\n  for(let i=0; i<90000; i++) {\n    document.body.appendChild(createRow(i));\n  }\n}",
                patchedCode: "function renderTable() {\n  const visibleRows = items.slice(page * pageSize, (page + 1) * pageSize);\n  visibleRows.forEach(row => renderRow(row));\n}"
              })
            });

            const result = await response.json();
            console.log("[WARDEN] Telemetry successfully queued:", result);
          } catch (err) {
            console.error("[WARDEN] Failed to dispatch live telemetry payload:", err);
          }
        });
        console.log("[WARDEN] Telemetry listener successfully bound to Crash Web button.");
      } else {
        console.warn("[WARDEN] Crash Web button element not found in DOM.");
      }
    });
  </script>
</body>

</html>
